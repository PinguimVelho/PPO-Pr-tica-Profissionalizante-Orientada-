<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
    <title>Sfypot</title>
</head>
<body>
    <h1>Sfypot</h1>
    <div class="modal">
        <header>
            <h2>Adicionar Música:</h2>
        </header>
        <form class="form-musica">
            <input type="file" id="arquivo" placeholder="Arquivo mp3" accept="audio/mp3" required>
            <br><br>
            <input type="text" id="title" placeholder="Título da música" required>
            <br><br>
            <input type="text" id="autor" placeholder="Nome do Autor" required>
            <br><br>
            <input type="text" id="genero" placeholder="Gênero da música" required>
            <br><br>
        </form>
        <footer>
            <button type="button" id="enviar-musica">Enviar</button>
            <button type="button" id="cancelar-musica">Cancelar</button>
        </footer>
    </div>
    
    <h2>Lista de Músicas:</h2>
    <table id="list-musicas">

        <thead>
            <th>#</th>
            <th>Musica</th>
            <th>Artista</th>
            <th>Duração</th>
        </thead>

        <tbody>

        </tbody>
    </table>

</body>
</html>
