<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
    <title>Sfypot</title>
</head>
<body>
    <h1>Sfypot</h1>
    <form class="form-musica">
        <input type="file" id="arquivo" placeholder="Arquivo mp3" accept="audio/mp3">
        <br><br>
        <input type="text" id="title" placeholder="Título da música" value="a" required>
        <br><br>
        <input type="text" id="autor" placeholder="Nome do Autor" value="b" required>
        <br><br>
        <input type="text" id="genero" placeholder="Gênero da música" value="c" required>
        <br><br>
        <button type="button" id="enviar-musica">Salvar Música</button>
    </form>

</body>
</html>
