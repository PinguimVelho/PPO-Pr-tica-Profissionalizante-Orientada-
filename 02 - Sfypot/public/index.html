<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
    <title>Sfypot</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>

    <h1>Sfypot</h1>

    <button type="button" id="cadastrarMusica">Cadastrar Música</button>
    <button type="button" id="criarAlbum">Criar Álbum</button>

    <h2>Lista de Músicas:</h2>
    <table id="list-musicas">

        <thead>
            <th>#</th>
            <th>Musica</th>
            <th>Artista</th>
            <th>Duração</th>
            <th>Opções</th>
        </thead>

        <tbody>

        </tbody>
    </table>

    <div class="player"> <!--  PLAYER -->
        <span id="musicName"></span>
        <span id="-1" class="indexMusica"></span>
        <audio id="audioPlayer" src=""></audio>
        <div class="controls">
            <button id="botaoBack"><i class='bx bx-skip-previous'></i></button>
            <button id="botaoPlayPause"><i class='bx bx-play'></i></button>
            <button id="botaoNext"><i class='bx bx-skip-next'></i></button>
        </div>
        <div class="footer">
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
            <div class="time">
                <span id="tempoAtual">0:00</span>
                <span id="duracao">0:00</span>
            </div>
        </div>
    </div>


    <div class="modal">
        <header>
            <h2>Adicionar Música:</h2>
        </header>
        <form class="form-musica">
            <input type="file" id="arquivo" placeholder="Arquivo mp3" accept="audio/mp3" required>
            <input type="text" id="title" placeholder="Título da música" required>
            <input type="text" id="autor" placeholder="Nome do Autor" required>
            <input type="text" id="genero" placeholder="Gênero da música" required>
            <select name="Álbum" id="album">
            </select>
        </form>
        <footer>
            <button type="button" id="enviar-musica">Enviar</button>
            <button type="button" id="cancelMusica">Cancelar</button>
        </footer>
    </div>

</body>

</html>
