<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
    <title>Sfypot</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <h1>Sfypot</h1>
    <button type="button" id="cadastrarMusica">Cadastrar Música</button>
    
    <h2>Lista de Músicas:</h2>
    <table id="list-musicas">

        <thead>
            <th>#</th>
            <th>Musica</th>
            <th>Artista</th>
            <th>Duração</th>
            <th>Opções</th>
        </thead>

        <tbody>

        </tbody>
    </table>

    <div class="player">
    <span id="musicName"></span>
    <audio id="player" src=""></audio>
    <div class="controls">
      <button id="botaoBack"><i class='bx bx-skip-previous'></i></button>
      <button id="botaoPlayPause"><i class='bx bx-caret-right'></i></button>
      <button id="botaoNext"><i class='bx bx-skip-next'></i></button>
    </div>
    <div class="footer">
      <div class="progress-bar">
        <div class="progress"></div>
    </div>
      <div class="time">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>
  </div>


  <div class="modal">
        <header>
            <h2>Adicionar Música:</h2>
        </header>
        <form class="form-musica">
            <input type="file" id="arquivo" placeholder="Arquivo mp3" accept="audio/mp3" required>
            <br><br>
            <input type="text" id="title" placeholder="Título da música" required>
            <br><br>
            <input type="text" id="autor" placeholder="Nome do Autor" required>
            <br><br>
            <input type="text" id="genero" placeholder="Gênero da música" required>
            <br><br>
            <select name="Álbum" id="album">
            </select>
            <br><br>
        </form>
        <footer>
            <button type="button" id="enviar-musica">Enviar</button>
            <button type="button" id="cancelMusica">Cancelar</button>
        </footer>
    </div>

</body>
</html>
